schema_version: 1

context:
  version: "0.3.0"

package:
  name: metamorph-mda-parser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/metamorph-mda-parser/metamorph_mda_parser-${{ version }}.tar.gz
  sha256: e8114a32bb696edeb269bc8c2e4931c40a88bec72680abad7a1311e8dc87f936

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling ==1.26.3
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - lark
    - pandas
    - pydantic

tests:
  - python:
      imports:
        - metamorph_mda_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Light-weight parsing of Metamorph/VisiView .nd files.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/metamorph-mda-parser/
  repository: https://github.com/fmi-faim/metamorph-mda-parser
  documentation: https://github.com/fmi-faim/metamorph-mda-parser

extra:
  recipe-maintainers:
    - imagejan
